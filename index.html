<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Buddy Budget</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="config.js"></script>
    <style>
        .tabs-content { display: none; }
        .tabs-content.active { display: block; }
        .select-clean { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
    <div id="app-content" class="min-h-screen flex flex-col">
        <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-6">
            <section id="tab-dashboard" class="tabs-content active space-y-4">
                <div class="flex items-center justify-between bg-white px-3 py-2 rounded-xl border border-slate-200 shadow-2xs h-12">
                    <button onclick="navigateMonth(1)" class="text-sm font-bold">&lt;</button>
                    <select id="dashboard-month-select" onchange="calculateDashboardMetrics()" class="select-clean bg-transparent text-center text-xs font-semibold cursor-pointer w-full"></select>
                    <button onclick="navigateMonth(-1)" class="text-sm font-bold">&gt;</button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <h3 class="text-xs font-semibold text-slate-400 uppercase">1. Cliquez sur une catégorie</h3>
                        <div id="categories-chart-container" class="grid grid-cols-1 gap-2"></div>
                    </div>
                    
                    <div class="space-y-2">
                        <h3 class="text-xs font-semibold text-slate-400 uppercase">2. Cliquez sur un poste pour voir les détails</h3>
                        <div id="postes-chart-container" class="space-y-1"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="details-drawer-modal" class="fixed inset-0 bg-slate-900/50 hidden flex items-center justify-center z-50" onclick="closeDetailsDrawer()">
        <div class="bg-white w-full max-w-sm rounded-xl p-4 shadow-2xl m-4" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-4">
                <h4 class="font-bold text-sm">Détails des transactions</h4>
                <button onclick="closeDetailsDrawer()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>
            <div id="drawer-content" class="max-h-60 overflow-y-auto"></div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
