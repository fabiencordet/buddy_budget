<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Buddy Budget</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="config.js"></script>
    <style>
        .tabs-content { display: none; }
        .tabs-content.active { display: block; }
        .select-clean { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">

    <div id="login-page" class="fixed inset-0 bg-slate-900 flex flex-col items-center justify-center z-50">
        <div class="bg-white p-8 rounded-2xl shadow-sm max-w-sm w-full mx-4 border border-slate-100">
            <h1 class="text-xl font-semibold mb-6 text-center text-slate-800">My Buddy Budget</h1>
            <input type="password" id="password-input" placeholder="Mot de passe" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl mb-4">
            <button onclick="checkPassword()" class="w-full bg-slate-900 text-white py-3 rounded-xl">Se connecter</button>
        </div>
    </div>

    <div id="app-content" class="hidden min-h-screen flex flex-col">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
                <span class="font-bold">My Buddy Budget</span>
                <nav class="flex space-x-1 bg-slate-100 p-1 rounded-xl">
                    <button onclick="switchTab('tab-dashboard')" id="btn-tab-dashboard" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-medium bg-white shadow-sm">Dashboard</button>
                    <button onclick="switchTab('tab-transactions')" id="btn-tab-transactions" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-medium">Transactions</button>
                </nav>
            </div>
        </header>

        <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-6">
            <section id="tab-dashboard" class="tabs-content active space-y-4">
                <select id="dashboard-month-select" onchange="calculateDashboardMetrics()" class="w-full p-2 border rounded-lg"></select>
                <div class="bg-white p-4 rounded-xl border shadow-sm h-[300px]"><canvas id="dashboard-trend-chart"></canvas></div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div id="categories-chart-container" class="space-y-2"></div>
                    <div id="postes-chart-container" class="space-y-2"></div>
                </div>
            </section>

            <section id="tab-transactions" class="tabs-content space-y-4">
                <button onclick="openTransactionModal()" class="bg-slate-900 text-white px-4 py-2 rounded-lg text-xs">+ Ajouter</button>
                <div class="bg-white rounded-xl border p-4">
                    <table class="w-full text-xs">
                        <thead><tr class="text-slate-400 border-b"><th>Date</th><th>Libellé</th><th>Montant</th></tr></thead>
                        <tbody id="pc-table-body"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="details-drawer-modal" class="fixed inset-0 bg-slate-900/50 hidden flex items-center justify-center z-50" onclick="closeDetailsDrawer()">
        <div class="bg-white w-full max-w-sm rounded-xl p-4 m-4" onclick="event.stopPropagation()">
            <div id="drawer-content"></div>
        </div>
    </div>
    
    <div id="transaction-modal" class="fixed inset-0 bg-slate-900/50 hidden z-50">
        </div>

    <script src="app.js"></script>
</body>
</html>
